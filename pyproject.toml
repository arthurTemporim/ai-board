[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"data/seed/seed_data.py" = ["E501"]  # prose strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
