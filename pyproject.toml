[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"data/seed/seed_data.py" = ["E501"]  # prose strings
"tests/graph/conftest.py" = ["F811"]  # re-exports the `db` fixture that tests then take as an argument
"ai/mcp_servers/*/server.py" = ["E501"]  # a tool's docstring is its description; one line each

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
