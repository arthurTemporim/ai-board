services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    # Run as the host user so files created in bind mounts (.data, migrations) are not root-owned.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MOCK_AI: ${MOCK_AI:-1}
    volumes:
      - .:/app
      - ./.data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: apps/web
      dockerfile: ../../docker/web.Dockerfile
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules # keep the image's installed packages, not the host's
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  web-node-modules:
